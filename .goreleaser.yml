version: 2

project_name: terraform-provider-terradash

before:
  hooks:
    - go mod tidy

builds:
  - id: provider
    main: .
    binary: terraform-provider-terradash_v{{ .Version }}
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
  - id: cli
    main: ./cmd/terradash
    binary: terradash
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: provider
    ids: [provider]
    formats: [zip]
    name_template: "terraform-provider-terradash_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: cli
    ids: [cli]
    formats: [binary]
    name_template: "terradash-{{ .Version }}-{{ .Os }}-{{ .Arch }}"

nfpms:
  - id: packages
    package_name: terradash
    ids: [provider, cli]
    formats: [deb, rpm, apk, archlinux]
    file_name_template: "{{ .ConventionalFileName }}"
    bindir: /usr/lib/terradash
    vendor: terradash
    homepage: https://github.com/alexmchughdev/terraform-provider-terradash
    maintainer: Alex McHugh <alex@alexmchugh.dev>
    description: Grafana dashboards in HCL - Terraform/OpenTofu provider and JSON-to-HCL converter.
    license: MPL-2.0
    contents:
      - src: ../lib/terradash/terradash
        dst: /usr/bin/terradash
        type: symlink
      - src: ../../../../../../../../lib/terradash/terraform-provider-terradash_v{{ .Version }}
        dst: /usr/share/terraform/plugins/registry.terraform.io/alexmchughdev/terradash/{{ .Version }}/linux_{{ .Arch }}/terraform-provider-terradash_v{{ .Version }}
        type: symlink
      - src: ../../../../../../../../lib/terradash/terraform-provider-terradash_v{{ .Version }}
        dst: /usr/share/terraform/plugins/registry.opentofu.org/alexmchughdev/terradash/{{ .Version }}/linux_{{ .Arch }}/terraform-provider-terradash_v{{ .Version }}
        type: symlink
      - src: LICENSE
        dst: /usr/share/licenses/terradash/LICENSE
      - src: README.md
        dst: /usr/share/doc/terradash/README.md

checksum:
  name_template: "terraform-provider-terradash_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
  ids: [provider]
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "terraform-provider-terradash_{{ .Version }}_manifest.json"

signs:
  - artifacts: checksum
    args:
      - --batch
      - --local-user
      - "{{ .Env.GPG_FINGERPRINT }}"
      - --output
      - "${signature}"
      - --detach-sign
      - "${artifact}"

release:
  draft: false
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "terraform-provider-terradash_{{ .Version }}_manifest.json"
  github:
    owner: alexmchughdev
    name: terraform-provider-terradash

changelog:
  disable: true
