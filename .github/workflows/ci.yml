name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - run: go tool cover -func=coverage.out | tail -n 1
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  acceptance:
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - tool: terraform
            version: "1.9.*"
          - tool: terraform
            version: "1.16.*"
          - tool: opentofu
            version: latest
    services:
      grafana:
        image: grafana/grafana:13.2.3
        env:
          GF_SECURITY_ADMIN_PASSWORD: admin
        ports:
          - 3000:3000
        options: >-
          --health-cmd "wget -qO- http://localhost:3000/api/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GRAFANA_URL: http://localhost:3000
      GRAFANA_AUTH: admin:admin
      TF_ACC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - if: matrix.tool == 'terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false
      - if: matrix.tool == 'opentofu'
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false
      - if: matrix.tool == 'opentofu'
        run: |
          echo "TF_ACC_TERRAFORM_PATH=$(command -v tofu)" >> "$GITHUB_ENV"
          echo "TF_ACC_PROVIDER_NAMESPACE=hashicorp" >> "$GITHUB_ENV"
      - run: go test ./internal/provider/ -run TestAcc -v -timeout 30m

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: make docs
        run: |
          make docs
          git diff --exit-code docs/
          test -z "$(git status --porcelain docs/)"

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check

  e2e:
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 30
    services:
      grafana:
        image: grafana/grafana:13.2.3
        env:
          GF_SECURITY_ADMIN_PASSWORD: admin
        ports:
          - 3000:3000
        options: >-
          --health-cmd "wget -qO- http://localhost:3000/api/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_wrapper: false
      - run: sudo apt-get install -y --no-install-recommends jq
      - run: ./scripts/e2e.sh terraform tofu
        env:
          GRAFANA_URL: http://localhost:3000
          GRAFANA_AUTH: admin:admin

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - run: shellcheck scripts/*.sh
