version: 2

project_name: terraform-provider-terragraph

before:
  hooks:
    - go mod tidy

builds:
  - id: provider
    main: .
    binary: terraform-provider-terragraph_v{{ .Version }}
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
  - id: cli
    main: ./cmd/terragraph
    binary: terragraph
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: provider
    ids: [provider]
    formats: [zip]
    name_template: "terraform-provider-terragraph_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: cli
    ids: [cli]
    formats: [tar.gz]
    name_template: "terragraph_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*

nfpms:
  - id: packages
    package_name: terragraph
    ids: [provider, cli]
    formats: [deb, rpm, apk, archlinux]
    file_name_template: "{{ .ConventionalFileName }}"
    bindir: /usr/lib/terragraph
    vendor: terragraph
    homepage: https://github.com/alexmchughdev/terraform-provider-terragraph
    maintainer: Alex McHugh <alexanderedwardmchugh@gmail.com>
    description: Grafana dashboards in HCL - Terraform/OpenTofu provider and JSON-to-HCL converter.
    license: MPL-2.0
    contents:
      - src: ../lib/terragraph/terragraph
        dst: /usr/bin/terragraph
        type: symlink
      - src: ../../../../../../../../lib/terragraph/terraform-provider-terragraph_v{{ .Version }}
        dst: /usr/share/terraform/plugins/registry.terraform.io/alexmchughdev/terragraph/{{ .Version }}/linux_{{ .Arch }}/terraform-provider-terragraph_v{{ .Version }}
        type: symlink
      - src: ../../../../../../../../lib/terragraph/terraform-provider-terragraph_v{{ .Version }}
        dst: /usr/share/terraform/plugins/registry.opentofu.org/alexmchughdev/terragraph/{{ .Version }}/linux_{{ .Arch }}/terraform-provider-terragraph_v{{ .Version }}
        type: symlink
      - src: LICENSE
        dst: /usr/share/licenses/terragraph/LICENSE
      - src: README.md
        dst: /usr/share/doc/terragraph/README.md

checksum:
  name_template: "terraform-provider-terragraph_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "terraform-provider-terragraph_{{ .Version }}_manifest.json"

signs:
  - artifacts: checksum
    args:
      - --batch
      - --local-user
      - "{{ .Env.GPG_FINGERPRINT }}"
      - --output
      - "${signature}"
      - --detach-sign
      - "${artifact}"

release:
  draft: false
  extra_files:
    - glob: terraform-registry-manifest.json
      name_template: "terraform-provider-terragraph_{{ .Version }}_manifest.json"
  github:
    owner: alexmchughdev
    name: terraform-provider-terragraph

changelog:
  disable: true
